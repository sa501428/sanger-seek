[project]
name = "sanger-seek"
version = "0.1.0"
description = "Local desktop Sanger trace review: chromatograms, forward/reverse reconciliation, variant annotation"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "pyqtgraph>=0.13.7",
    "biopython>=1.83",
    "numpy>=1.26",
]

[project.optional-dependencies]
fast = ["edlib>=1.3"]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.11"]

[project.scripts]
sanger-seek = "sanger_seek.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sanger_seek*"]

[tool.setuptools.package-data]
sanger_seek = ["resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
